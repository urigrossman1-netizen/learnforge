[project]
name = "drum-agent"
version = "0.1.0"
description = "Find a song (YouTube + Spotify), acquire its audio locally, and transcribe the drums into a chart."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0",
    "mido>=1.3",
    "yt-dlp[default]>=2026.8.19",
    "deno>=2.6.6",
    "imageio-ffmpeg>=0.6",
    # numba/llvmlite stopped publishing Intel-macOS wheels after 0.62 / 0.45.
    "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
drum-agent = "drum_agent.cli:main"

[tool.uv]
# Wheel-only, so `uv lock` fails instead of silently locking a version that would
# need an LLVM build on one of the platforms below.
no-build-package = ["numba", "llvmlite"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drum_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
